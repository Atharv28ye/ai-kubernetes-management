---
# Deployment with app=correct-labels
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: correct-labels
  template:
    metadata:
      labels:
        app: correct-labels
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
# Service with wrong selector (app=wrong-labels)
apiVersion: v1
kind: Service
metadata:
  name: test-service
  namespace: default
spec:
  selector:
    app: wrong-labels  # This selector doesn't match the deployment labels
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
